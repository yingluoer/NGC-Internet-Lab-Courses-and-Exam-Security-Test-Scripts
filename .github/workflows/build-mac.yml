name: build-mac

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                 # 打 tag 自动触发

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m playwright install chromium

      - name: 生成 mac 版 spec 并打包
        run: |
          echo "=== 诊断: playwright 浏览器目录 ==="
          ls -la ~/Library/Caches/ms-playwright/ 2>&1 || echo "ms-playwright 目录不存在"
          echo "=== 诊断: 依赖位置 ==="
          python -c "import ddddocr,os;print('ddddocr:',os.path.dirname(os.path.abspath(ddddocr.__file__)))" 2>&1
          python -c "import playwright,os;print('playwright:',os.path.dirname(os.path.abspath(playwright.__file__)))" 2>&1
          python -c "import flask;print('flask:',flask.__version__)" 2>&1
          python - << 'PYEOF'
          import os
          DDDDOCR_DIR = None
          try:
              import ddddocr as _ddddocr
              DDDDOCR_DIR = os.path.dirname(os.path.abspath(_ddddocr.__file__))
          except Exception as e:
              print('ddddocr import 失败:', e)
          PLAYWRIGHT_DIR = None
          try:
              import playwright as _playwright
              PLAYWRIGHT_DIR = os.path.dirname(os.path.abspath(_playwright.__file__))
          except Exception as e:
              print('playwright import 失败:', e)

          PW = os.path.join(os.path.expanduser("~"), "Library/Caches/ms-playwright")
          chromium = ffmpeg = None
          if os.path.isdir(PW):
              for d in sorted(os.listdir(PW)):
                  if d.startswith("chromium"):
                      chromium = os.path.join(PW, d)
                  elif d.startswith("ffmpeg"):
                      ffmpeg = os.path.join(PW, d)
          print('chromium:', chromium)
          print('ffmpeg:', ffmpeg)

          datas = ["('static', 'static')", "('question_bank.json', '.')"]
          if DDDDOCR_DIR:
              datas.append("(%r, 'ddddocr')" % DDDDOCR_DIR)
          if PLAYWRIGHT_DIR:
              datas.append("(%r, 'playwright')" % PLAYWRIGHT_DIR)
          if chromium:
              datas.append("(%r, 'ms-playwright/%s')" % (chromium, os.path.basename(chromium)))
          if ffmpeg:
              datas.append("(%r, 'ms-playwright/%s')" % (ffmpeg, os.path.basename(ffmpeg)))

          spec = "# -*- mode: python ; coding: utf-8 -*-\nimport os\n"
          spec += "a = Analysis(\n    ['server.py'],\n    pathex=[os.path.abspath('.')],\n    binaries=[],\n    datas=[\n"
          spec += ",\n".join("        " + d for d in datas)
          spec += "\n    ],\n"
          spec += "    hiddenimports=['nk_auto','question_bank','feature_flags','flask','Crypto.Cipher.AES','Crypto.Util.Padding','ddddocr','onnxruntime','playwright','PIL'],\n"
          spec += "    excludes=['pytest','unittest','doctest'],\n)\n"
          spec += "pyz = PYZ(a.pure, a.zipped_data)\n"
          spec += "exe = EXE(pyz, a.scripts, a.binaries, a.zipfiles, a.datas, [], name='SafetyTerminal-mac', debug=False, strip=False, upx=False, console=True)\n"
          open('SafetyTerminal_mac.spec', 'w', encoding='utf-8').write(spec)
          print('mac spec 已生成')
          PYEOF

          echo "=== spec 内容 ==="
          cat SafetyTerminal_mac.spec
          echo "=== PyInstaller 打包 ==="
          set -o pipefail
          python -m PyInstaller --clean --noconfirm SafetyTerminal_mac.spec 2>&1 | tail -60
          echo "=== dist 目录 ==="
          ls -la dist/
          find dist -type f 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SafetyTerminal-mac
          path: dist/**
