name: build-mac

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                 # 打 tag 自动触发

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m playwright install chromium

      - name: 生成 mac 版 spec 并打包
        run: |
          echo "=== 诊断: playwright 浏览器目录 ==="
          ls -la ~/Library/Caches/ms-playwright/ 2>&1 || echo "ms-playwright 目录不存在"
          echo "=== 诊断: 依赖位置 ==="
          python -c "import ddddocr,os;print('ddddocr:',os.path.dirname(os.path.abspath(ddddocr.__file__)))" 2>&1
          python -c "import playwright,os;print('playwright:',os.path.dirname(os.path.abspath(playwright.__file__)))" 2>&1
          python -c "import flask;print('flask:',flask.__version__)" 2>&1
          python - << 'PYEOF'
          import os
          DDDDOCR_DIR = None
          try:
              import ddddocr as _ddddocr
              DDDDOCR_DIR = os.path.dirname(os.path.abspath(_ddddocr.__file__))
          except Exception as e:
              print('ddddocr import 失败:', e)
          PLAYWRIGHT_DIR = None
          try:
              import playwright as _playwright
              PLAYWRIGHT_DIR = os.path.dirname(os.path.abspath(_playwright.__file__))
          except Exception as e:
              print('playwright import 失败:', e)

          PW = os.path.join(os.path.expanduser("~"), "Library/Caches/ms-playwright")
          chromium = ffmpeg = None
          if os.path.isdir(PW):
              for d in sorted(os.listdir(PW)):
                  if d.startswith("chromium"):
                      chromium = os.path.join(PW, d)
                  elif d.startswith("ffmpeg"):
                      ffmpeg = os.path.join(PW, d)
          print('chromium:', chromium)
          print('ffmpeg:', ffmpeg)

          datas = ["('static', 'static')", "('question_bank.json', '.')"]
          if DDDDOCR_DIR:
              datas.append("(%r, 'ddddocr')" % DDDDOCR_DIR)
          if PLAYWRIGHT_DIR:
              datas.append("(%r, 'playwright')" % PLAYWRIGHT_DIR)
          # 不打包 chromium/ffmpeg 浏览器: mac arm64 的 dylib 无 headerpad,
          # install_name_tool 修改 libEGL.dylib 失败。登录改用本机 Chrome/Edge。

          spec = "# -*- mode: python ; coding: utf-8 -*-\nimport os\n"
          spec += "a = Analysis(\n    ['server.py'],\n    pathex=[os.path.abspath('.')],\n    binaries=[],\n    datas=[\n"
          spec += ",\n".join("        " + d for d in datas)
          spec += "\n    ],\n"
          spec += "    hiddenimports=['nk_auto','question_bank','feature_flags','flask','Crypto.Cipher.AES','Crypto.Util.Padding','ddddocr','onnxruntime','playwright','PIL'],\n"
          spec += "    excludes=['pytest','unittest','doctest'],\n)\n"
          spec += "pyz = PYZ(a.pure, a.zipped_data)\n"
          # 打包成 .app bundle: 双击即可运行, 不用终端敲 chmod
          # console=True: 双击后同时弹终端和浏览器, 出错时日志可见(不然崩了没有任何提示)
          spec += "exe = EXE(pyz, a.scripts, a.binaries, a.zipfiles, a.datas, [], name='Ngc-mac-bin', debug=False, strip=False, upx=False, console=True)\n"
          # bundle 文件名必须 ASCII: 中文 zip 名跨平台解压会乱码, 乱码路径直接导致 app 打不开
          # 界面内的中文名走 CFBundleDisplayName, 不受影响
          spec += "app = BUNDLE(exe, name='NgcLabSafety.app', icon=None,\n"
          spec += "    bundle_identifier='com.yingluo.ngc.labsafety',\n"
          spec += "    info_plist={\n"
          spec += "        'CFBundleName': 'NgcLabSafety',\n"
          spec += "        'CFBundleDisplayName': '南京工程学院互联网+实验室课程及考试安全测试程序',\n"
          spec += "        'CFBundleShortVersionString': '2.4.12',\n"
          spec += "        'CFBundleVersion': '2.4.12',\n"
          spec += "        'NSHighResolutionCapable': True,\n"
          spec += "        'LSMinimumSystemVersion': '10.15',\n"
          spec += "    })\n"
          open('SafetyTerminal_mac.spec', 'w', encoding='utf-8').write(spec)
          print('mac spec 已生成')
          PYEOF

          echo "=== spec 内容 ==="
          cat SafetyTerminal_mac.spec
          echo "=== PyInstaller 打包 ==="
          set -o pipefail
          python -m PyInstaller --clean --noconfirm SafetyTerminal_mac.spec 2>&1 | tail -60

          echo "=== dist 目录 ==="
          ls -la dist/
          echo "=== ad-hoc 重签（保证 bundle 签名一致, 减少打不开的情况）==="
          codesign --force --deep -s - dist/NgcLabSafety.app 2>&1 || echo "codesign 失败(继续)"
          codesign --verify --deep --verbose=2 dist/NgcLabSafety.app 2>&1 || true
          echo "=== 压缩 .app（ditto 保留可执行位与资源分支）==="
          APP_DIR=$(ls -d dist/*.app | head -1)
          echo "APP_DIR=$APP_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/Ngc-mac.app.zip"
          ls -la dist/*.zip
          echo "=== 校验 ==="
          unzip -l "dist/Ngc-mac.app.zip" | head -12

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Ngc-mac-app
          path: dist/Ngc-mac.app.zip
